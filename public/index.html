<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>tiny-chat</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --panel-edge: #161e2a;
      --recessed: #0a0e12;
      --text: #e6f1ff;
      --muted: #7f8ea3;
      --accent: #00e5ff;
      --accent-soft: #00bcd4;
      --border-dark: #05080c;
      --border-light: #1c2733;
      --danger: #ff5577;
      --warn: #ffb547;
      --ok: #3ddc97;

      --ease: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);

      --sh-panel: 6px 6px 16px rgba(0,0,0,0.7), -2px -2px 8px rgba(0,229,255,0.04);
      --sh-recessed: inset 4px 4px 10px rgba(0,0,0,0.4), inset -1px -1px 4px rgba(0,229,255,0.05);
      --sh-glow: 0 0 8px rgba(0,229,255,0.5), 0 0 24px rgba(0,229,255,0.2);
      --sh-button: 0 6px 14px rgba(0,0,0,0.7), 0 0 10px rgba(0,229,255,0.35);
      --sh-button-hover: 0 8px 20px rgba(0,0,0,0.8), 0 0 18px rgba(0,229,255,0.6);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background:
        radial-gradient(ellipse at top, rgba(0,229,255,0.06), transparent 55%),
        radial-gradient(ellipse at bottom, rgba(0,188,212,0.04), transparent 60%),
        var(--bg);
      color: var(--text);
      font: 15px/1.5 "Arimo","Inter",Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(0,229,255,0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }

    /* ===== Login (terminal boot panel) ===== */
    .login {
      position: relative;
      z-index: 1;
      margin: auto;
      width: min(380px, 92vw);
      background: linear-gradient(180deg, var(--panel-edge), var(--panel));
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 28px 24px 24px;
      box-shadow: var(--sh-panel);
    }

    .login::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 10px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(0,229,255,0.04);
    }

    .login h1 {
      margin: 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0,229,255,0.45);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .login h1::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent), 0 0 16px rgba(0,229,255,0.5);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .login p {
      margin: 6px 0 22px;
      color: var(--muted);
      font-size: 12.5px;
      letter-spacing: 0.02em;
    }

    .login label {
      display: block;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 6px;
    }

    .login input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-dark);
      background: var(--recessed);
      color: var(--accent);
      font: 500 14px/1 "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.04em;
      box-shadow: var(--sh-recessed);
      transition: box-shadow 200ms var(--ease-soft);
      outline: none;
    }

    .login input:focus {
      box-shadow: var(--sh-recessed), 0 0 0 1px var(--accent), 0 0 12px rgba(0,229,255,0.45);
    }

    .login button {
      width: 100%;
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0,229,255,0.6);
      background: linear-gradient(180deg, #00f0ff, var(--accent-soft));
      color: #001014;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--sh-button);
      transition: transform 150ms var(--ease), box-shadow 200ms var(--ease-soft);
    }

    .login button:hover {
      box-shadow: var(--sh-button-hover);
    }

    .login button:active {
      transform: translateY(2px);
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5), 0 0 6px rgba(0,229,255,0.4);
    }

    /* ===== Chat shell ===== */
    .chat {
      display: none;
      flex: 1;
      min-height: 0;
    }

    .chat.active {
      display: flex;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      margin: 0 auto;
      /* flex: 1; */
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      border-left: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px var(--border-dark);
    }

    /* ===== Header ===== */
    .header {
      padding: 14px 18px;
      display: flex;
      align-items: stretch;
      gap: 16px;
      background: linear-gradient(180deg, var(--panel-edge), var(--panel));
      border-bottom: 1px solid var(--border-dark);
      box-shadow: 0 1px 0 rgba(0,229,255,0.05);
    }

    .header .room {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .label {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .room-code {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0,229,255,0.35);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      padding: 4px 8px;
      margin-left: -8px;
      border-radius: 4px;
      transition: background 150ms var(--ease-soft);
    }

    .room-code:hover {
      background: rgba(0,229,255,0.06);
    }

    .header .divider {
      width: 1px;
      align-self: stretch;
      background: linear-gradient(180deg, transparent, var(--border-light) 30%, var(--border-light) 70%, transparent);
    }

    .header .presence {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .presence-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .presence-count {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      color: var(--accent-soft);
    }

    .presence-list {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .presence-list .sep {
      color: var(--border-light);
      margin: 0 2px;
    }

    .presence-list .name {
      font-weight: 500;
    }

    .led {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok), 0 0 12px rgba(61,220,151,0.5);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    /* ===== Messages ===== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 6px;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: var(--border-light) transparent;
    }

    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 4px;
    }
    .messages::-webkit-scrollbar-thumb:hover { background: var(--accent-soft); }

    .msg {
      display: flex;
      flex-direction: column;
      margin-top: 16px;
      animation: msg-in 260ms var(--ease) both;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.grouped { margin-top: 3px; }
    .msg.grouped .meta { display: none; }

    .msg .meta {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 3px;
    }

    .msg .who {
      font-size: 13px;
      letter-spacing: 0.01em;
    }

    .msg .ts {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .msg .text {
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      font-size: 14.5px;
      color: var(--text);
      line-height: 1.55;
    }

    .msg .text a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(0,229,255,0.4);
      padding-bottom: 1px;
      transition: border-color 150ms, text-shadow 150ms;
    }

    .msg .text a:hover {
      border-bottom-color: var(--accent);
      text-shadow: 0 0 8px rgba(0,229,255,0.5);
    }

    .msg.system .text {
      color: var(--muted);
      font-style: italic;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    /* ===== File / image bubbles ===== */
    .file-card {
      margin-top: 4px;
      max-width: 360px;
      border: 1px solid var(--border-light);
      background: var(--recessed);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--sh-recessed);
    }
    .file-card .row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      color: var(--text);
    }
    .file-card .fname {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent);
    }
    .file-card .fsize {
      color: var(--muted);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .file-card .download {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(0,229,255,0.4);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .file-card .download:hover { text-shadow: 0 0 8px rgba(0,229,255,0.5); }
    .file-card .progress {
      height: 4px;
      background: var(--border-dark);
      border-radius: 2px;
      overflow: hidden;
    }
    .file-card .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-soft), var(--accent));
      box-shadow: 0 0 8px rgba(0,229,255,0.5);
      transition: width 120ms linear;
    }
    .file-card .status {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .file-card .status.err { color: var(--danger); }
    .file-card .status.ok { color: var(--ok); }
    .file-card img.preview {
      max-width: 100%;
      max-height: 320px;
      border-radius: 6px;
      display: block;
      cursor: pointer;
    }

    /* ===== Composer attach button ===== */
    .composer .attach {
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--border-light);
      background: var(--recessed);
      color: var(--accent);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 16px;
      cursor: pointer;
      box-shadow: var(--sh-recessed);
      transition: box-shadow 200ms var(--ease-soft), color 150ms;
    }
    .composer .attach:hover {
      box-shadow: var(--sh-recessed), 0 0 0 1px var(--accent), 0 0 10px rgba(0,229,255,0.3);
    }

    /* ===== Drag-drop overlay ===== */
    .shell.dragover::after {
      content: "drop to send";
      position: absolute;
      inset: 0;
      background: rgba(0,229,255,0.08);
      border: 2px dashed var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0,229,255,0.6);
      pointer-events: none;
      z-index: 10;
    }

    /* ===== Banner ===== */
    .reconnect-banner {
      background: linear-gradient(180deg, rgba(255,181,71,0.12), rgba(255,181,71,0.04));
      color: var(--warn);
      border-bottom: 1px solid rgba(255,181,71,0.25);
      padding: 7px 14px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      display: none;
    }
    .reconnect-banner.show { display: block; }

    /* ===== Typing ===== */
    .typing {
      padding: 6px 18px 4px;
      color: var(--muted);
      font-size: 12px;
      min-height: 22px;
      font-style: italic;
    }

    .typing .dot {
      display: inline-block;
      animation: blink 1.2s infinite;
      color: var(--accent);
    }
    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* ===== Composer (terminal slot) ===== */
    .composer {
      border-top: 1px solid var(--border-dark);
      background: linear-gradient(180deg, var(--panel), var(--panel-edge));
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      box-shadow: 0 -1px 0 rgba(0,229,255,0.04);
    }

    .composer .input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .composer .prompt {
      position: absolute;
      left: 12px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      color: var(--accent-soft);
      font-size: 13px;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0,229,255,0.3);
    }

    .composer input {
      flex: 1;
      width: 100%;
      padding: 12px 14px 12px 30px;
      border-radius: 6px;
      border: 1px solid var(--border-dark);
      background: var(--recessed);
      color: var(--accent);
      font: 500 14px/1 "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.02em;
      box-shadow: var(--sh-recessed);
      transition: box-shadow 200ms var(--ease-soft);
      outline: none;
    }

    .composer input:focus {
      box-shadow: var(--sh-recessed), 0 0 0 1px var(--accent), 0 0 12px rgba(0,229,255,0.45);
    }

    .composer input::placeholder {
      color: rgba(127,142,163,0.6);
    }

    .composer button {
      padding: 0 18px;
      border-radius: 6px;
      border: 1px solid rgba(0,229,255,0.55);
      background: linear-gradient(180deg, #00f0ff, var(--accent-soft));
      color: #001014;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--sh-button);
      transition: transform 150ms var(--ease), box-shadow 200ms var(--ease-soft);
    }

    .composer button:hover { box-shadow: var(--sh-button-hover); }
    .composer button:active {
      transform: translateY(2px);
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5), 0 0 6px rgba(0,229,255,0.4);
    }

    @media (max-width: 480px) {
      .header { padding: 12px 14px; gap: 12px; }
      .room-code { max-width: 120px; font-size: 13px; }
      .messages { padding: 14px 14px 4px; }
      .composer { padding: 12px 12px; }
      .composer button { padding: 0 14px; font-size: 10px; }
    }
  </style>
</head>

<body>

  <div id="login" class="login">
    <h1>tiny-chat // online</h1>
    <p>Pick a name and a shared room key to enter the channel.</p>
    <form id="login-form">
      <label for="name">Name</label>
      <input id="name" required maxlength="32" autocomplete="nickname" placeholder="agent_01" />
      <label for="room">Room key</label>
      <input id="room" required maxlength="64" autocomplete="off" placeholder="8976" />
      <button type="submit">Connect</button>
    </form>
  </div>

  <div id="chat" class="chat">
    <div class="shell">
      <div class="header">
        <div class="room">
          <span class="label">Room</span>
          <span class="room-code" id="room-code" title="Click to copy"></span>
        </div>
        <div class="divider"></div>
        <div class="presence">
          <div class="presence-head">
            <span class="led" aria-hidden="true"></span>
            <span class="label">Members</span>
            <span class="presence-count" id="presence-count"></span>
          </div>
          <div class="presence-list" id="presence-list">connecting…</div>
        </div>
      </div>
      <div id="reconnect-banner" class="reconnect-banner">// reconnecting</div>
      <div id="messages" class="messages"></div>
      <div id="typing" class="typing"></div>
      <form id="composer" class="composer">
        <button type="button" class="attach" id="attach" title="Send file or image" aria-label="Attach file">+</button>
        <input type="file" id="file-input" hidden multiple />
        <div class="input-wrap">
          <span class="prompt">&gt;</span>
          <input id="text" placeholder="transmit message…" autocomplete="off" maxlength="2000" />
        </div>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script type="module">
    import PartySocket from "https://esm.sh/partysocket@1";

    const $ = (id) => document.getElementById(id);
    const loginEl = $("login");
    const chatEl = $("chat");
    const messagesEl = $("messages");
    const presenceListEl = $("presence-list");
    const presenceCountEl = $("presence-count");
    const reconnectEl = $("reconnect-banner");
    const typingEl = $("typing");
    const roomCodeEl = $("room-code");

    roomCodeEl.addEventListener("click", async () => {
      const code = roomCodeEl.dataset.room || "";
      if (!code) return;
      try {
        await navigator.clipboard.writeText(code);
        const original = roomCodeEl.textContent;
        roomCodeEl.textContent = "copied";
        setTimeout(() => { roomCodeEl.textContent = original; }, 900);
      } catch {}
    });

    const GROUP_WINDOW_MS = 60_000;
    const TYPING_IDLE_MS = 3_000;
    const typingUsers = new Map(); // who -> timeoutId
    let amTyping = false;
    let typingStopTimer = null;

    const saved = JSON.parse(localStorage.getItem("tiny-chat") || "{}");
    if (saved.name) $("name").value = saved.name;
    if (saved.room) $("room").value = saved.room;

    let socket = null;
    let myName = "";
    let myId = null;
    let lastMsg = null;
    const peers = new Map(); // id -> who
    const ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];
    const CHUNK_SIZE = 16 * 1024;
    const MAX_BUFFER = 1 * 1024 * 1024;
    const incoming = new Map(); // fileId -> { from, fromWho, name, size, mime, received, chunks, card }
    const outgoing = new Map(); // fileId -> { name, size, mime, blobUrl, peers: Map(peerId -> {status, pc, dc, statusEl}) }

    $("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("name").value.trim().slice(0, 32);
      const room = $("room").value.trim().slice(0, 64);
      if (!name || !room) return;
      myName = name;
      localStorage.setItem("tiny-chat", JSON.stringify({ name, room }));
      loginEl.style.display = "none";
      chatEl.classList.add("active");
      roomCodeEl.textContent = room;
      roomCodeEl.dataset.room = room;
      connect(room, name);
    });

    function connect(room, name) {
      socket = new PartySocket({
        host: window.location.host,
        room,
      });

      socket.addEventListener("open", () => {
        reconnectEl.classList.remove("show");
        socket.send(JSON.stringify({ type: "hello", who: name }));
      });

      socket.addEventListener("message", (e) => {
        let data;
        try { data = JSON.parse(e.data); } catch { return; }
        if (data.type === "history") {
          messagesEl.innerHTML = "";
          lastMsg = null;
          for (const m of data.messages) renderMessage(m);
          scrollToBottom();
        } else if (data.type === "msg") {
          const wasAtBottom = isAtBottom();
          renderMessage(data.message);
          if (wasAtBottom) scrollToBottom();
        } else if (data.type === "cleared") {
          messagesEl.innerHTML = "";
          lastMsg = null;
          const note = document.createElement("div");
          note.className = "msg system";
          const text = document.createElement("span");
          text.className = "text";
          text.textContent = `// history cleared by ${data.who}`;
          note.appendChild(text);
          messagesEl.appendChild(note);
          scrollToBottom();
        } else if (data.type === "presence") {
          peers.clear();
          for (const u of data.users) peers.set(u.id, u.who);
          renderPresence(data.users);
        } else if (data.type === "self") {
          myId = data.id;
        } else if (data.type === "typing") {
          handleTyping(data.who, data.isTyping);
        } else if (data.type === "file-offer") {
          handleFileOffer(data);
        } else if (data.type === "signal") {
          handleSignal(data);
        }
      });

      socket.addEventListener("close", () => {
        reconnectEl.classList.add("show");
      });
    }

    $("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = $("text");
      const text = input.value;
      if (!text.trim() || !socket) return;
      if (text.trim() === "/clear") {
        if (confirm("Clear all messages in this room for everyone?")) {
          socket.send(JSON.stringify({ type: "clear" }));
        }
        input.value = "";
        stopTyping();
        return;
      }
      socket.send(JSON.stringify({ type: "msg", text }));
      input.value = "";
      stopTyping();
    });

    $("text").addEventListener("input", () => {
      const hasText = $("text").value.trim().length > 0;
      if (hasText) startTyping();
      else stopTyping();
    });

    function startTyping() {
      if (!socket) return;
      if (!amTyping) {
        amTyping = true;
        socket.send(JSON.stringify({ type: "typing", isTyping: true }));
      }
      clearTimeout(typingStopTimer);
      typingStopTimer = setTimeout(stopTyping, TYPING_IDLE_MS);
    }

    function stopTyping() {
      clearTimeout(typingStopTimer);
      typingStopTimer = null;
      if (!amTyping) return;
      amTyping = false;
      if (socket) socket.send(JSON.stringify({ type: "typing", isTyping: false }));
    }

    function handleTyping(who, isTyping) {
      const existing = typingUsers.get(who);
      if (existing) clearTimeout(existing);
      if (isTyping) {
        const t = setTimeout(() => {
          typingUsers.delete(who);
          renderTyping();
        }, TYPING_IDLE_MS + 2000);
        typingUsers.set(who, t);
      } else {
        typingUsers.delete(who);
      }
      renderTyping();
    }

    function renderTyping() {
      const names = [...typingUsers.keys()];
      if (!names.length) {
        typingEl.textContent = "";
        return;
      }
      typingEl.innerHTML = "";
      names.forEach((u, i) => {
        const span = document.createElement("span");
        span.textContent = u;
        span.style.color = colorFor(u);
        typingEl.appendChild(span);
        if (i < names.length - 1) typingEl.append(", ");
      });
      const verb = names.length === 1 ? " is typing" : " are typing";
      typingEl.append(verb);
      const dots = document.createElement("span");
      dots.innerHTML = '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
      typingEl.append(dots);
    }

    function renderMessage(m) {
      const grouped =
        lastMsg &&
        lastMsg.who === m.who &&
        m.ts - lastMsg.ts < GROUP_WINDOW_MS;

      const wrap = document.createElement("div");
      wrap.className = grouped ? "msg grouped" : "msg";

      const meta = document.createElement("div");
      meta.className = "meta";
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = m.who;
      who.style.color = colorFor(m.who);
      const ts = document.createElement("span");
      ts.className = "ts";
      ts.textContent = formatTime(m.ts);
      ts.title = new Date(m.ts).toLocaleString();
      meta.append(who, ts);

      const text = document.createElement("span");
      text.className = "text";
      linkify(text, m.text);

      wrap.append(meta, text);
      messagesEl.appendChild(wrap);
      lastMsg = m;
    }

    const URL_RE = /(https?:\/\/[^\s<]+[^\s<.,!?:;'")\]])/gi;

    function linkify(node, text) {
      let last = 0;
      let match;
      while ((match = URL_RE.exec(text)) !== null) {
        if (match.index > last) {
          node.appendChild(document.createTextNode(text.slice(last, match.index)));
        }
        const a = document.createElement("a");
        a.href = match[0];
        a.textContent = match[0];
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        node.appendChild(a);
        last = match.index + match[0].length;
      }
      if (last < text.length) {
        node.appendChild(document.createTextNode(text.slice(last)));
      }
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
      if (sameDay) return time;
      const yest = new Date(now); yest.setDate(now.getDate() - 1);
      if (d.toDateString() === yest.toDateString()) return `yest ${time}`;
      return `${d.toLocaleDateString([], { month: "short", day: "numeric" })} ${time}`;
    }

    function renderPresence(users) {
      if (!users.length) {
        presenceListEl.textContent = "channel empty";
        presenceCountEl.textContent = "[0]";
        return;
      }
      presenceListEl.innerHTML = "";
      users.forEach((u, i) => {
        const span = document.createElement("span");
        span.className = "name";
        span.textContent = u.who;
        span.style.color = colorFor(u.who);
        presenceListEl.appendChild(span);
        if (i < users.length - 1) {
          const sep = document.createElement("span");
          sep.className = "sep";
          sep.textContent = "·";
          presenceListEl.appendChild(sep);
        }
      });
      presenceCountEl.textContent = `[${String(users.length).padStart(2, "0")}]`;
    }

    function colorFor(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = (h + name.charCodeAt(i)) % 360;
      return `hsl(${h}, 70%, 70%)`;
    }

    function isAtBottom() {
      return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
    }
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ===== File transfer (WebRTC P2P) =====

    function formatBytes(n) {
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      if (n < 1024 * 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
      return `${(n / 1024 / 1024 / 1024).toFixed(2)} GB`;
    }

    function renderFileBubble({ who, name, size, mime, ts, direction, peerStatuses }) {
      const grouped =
        lastMsg && lastMsg.who === who && (ts - lastMsg.ts) < GROUP_WINDOW_MS;
      const wrap = document.createElement("div");
      wrap.className = grouped ? "msg grouped" : "msg";

      const meta = document.createElement("div");
      meta.className = "meta";
      const whoEl = document.createElement("span");
      whoEl.className = "who";
      whoEl.textContent = who;
      whoEl.style.color = colorFor(who);
      const tsEl = document.createElement("span");
      tsEl.className = "ts";
      tsEl.textContent = formatTime(ts);
      tsEl.title = new Date(ts).toLocaleString();
      meta.append(whoEl, tsEl);

      const card = document.createElement("div");
      card.className = "file-card";

      const row = document.createElement("div");
      row.className = "row";
      const fname = document.createElement("span");
      fname.className = "fname";
      fname.textContent = name;
      const fsize = document.createElement("span");
      fsize.className = "fsize";
      fsize.textContent = formatBytes(size);
      row.append(fname, fsize);

      const prog = document.createElement("div");
      prog.className = "progress";
      const bar = document.createElement("span");
      prog.appendChild(bar);

      const status = document.createElement("div");
      status.className = "status";
      status.textContent = direction === "out" ? "preparing…" : "incoming…";

      card.append(row, prog, status);

      const previewSlot = document.createElement("div");
      card.appendChild(previewSlot);

      wrap.append(meta, card);
      messagesEl.appendChild(wrap);
      lastMsg = { who, ts };

      return { card, bar, status, previewSlot, fname };
    }

    // Track live object URLs so we can revoke them when their DOM node is removed.
    const liveBlobUrls = new WeakMap(); // element -> url
    const blobObserver = new MutationObserver((muts) => {
      for (const m of muts) {
        for (const node of m.removedNodes) {
          if (!(node instanceof HTMLElement)) continue;
          node.querySelectorAll("[data-blob-url]").forEach((el) => {
            const url = liveBlobUrls.get(el);
            if (url) { URL.revokeObjectURL(url); liveBlobUrls.delete(el); }
          });
        }
      }
    });
    blobObserver.observe(messagesEl, { childList: true });

    function showPreview(card, blob, name, mime) {
      const url = URL.createObjectURL(blob);
      card.previewSlot.innerHTML = "";
      if (mime && mime.startsWith("image/")) {
        const img = document.createElement("img");
        img.className = "preview";
        img.src = url;
        img.dataset.blobUrl = "1";
        liveBlobUrls.set(img, url);
        img.addEventListener("click", () => window.open(url, "_blank"));
        card.previewSlot.appendChild(img);
      }
      const dl = document.createElement("a");
      dl.className = "download";
      dl.href = url;
      dl.download = name;
      dl.textContent = "download";
      dl.dataset.blobUrl = "1";
      liveBlobUrls.set(dl, url);
      card.previewSlot.appendChild(dl);
    }

    async function sendFile(file) {
      if (!socket || !myId) return;
      const wasAtBottom = isAtBottom();
      const fileId = crypto.randomUUID();
      const meta = { name: file.name, size: file.size, mime: file.type || "application/octet-stream" };
      const ts = Date.now();

      const card = renderFileBubble({
        who: myName, name: meta.name, size: meta.size, mime: meta.mime, ts, direction: "out",
      });
      if (wasAtBottom) scrollToBottom();

      const targets = [...peers.keys()].filter((id) => id !== myId);
      if (targets.length === 0) {
        card.status.textContent = "no peers connected";
        card.status.classList.add("err");
        return;
      }

      socket.send(JSON.stringify({ type: "file-offer", fileId, ...meta }));

      const record = { name: meta.name, size: meta.size, mime: meta.mime, peers: new Map(), card };
      outgoing.set(fileId, record);

      const updateAggregate = () => {
        const states = [...record.peers.values()];
        const done = states.filter((s) => s.status === "done").length;
        const failed = states.filter((s) => s.status === "failed").length;
        const total = states.length;
        if (done + failed === total) {
          if (failed === 0) {
            card.status.textContent = `sent to ${done}/${total}`;
            card.status.classList.add("ok");
            card.bar.style.width = "100%";
          } else {
            card.status.textContent = `sent to ${done}/${total} (${failed} failed)`;
            card.status.classList.add(failed === total ? "err" : "");
          }
        } else {
          const sending = states.filter((s) => s.status === "sending");
          const minProg = sending.length
            ? Math.min(...sending.map((s) => s.progress || 0))
            : 0;
          card.status.textContent = `sending to ${total} peer${total > 1 ? "s" : ""}…`;
          card.bar.style.width = `${Math.round(minProg * 100)}%`;
        }
      };

      for (const peerId of targets) {
        const state = { status: "connecting", progress: 0 };
        record.peers.set(peerId, state);
        sendFileToPeer(fileId, peerId, file, meta, state, updateAggregate).catch((err) => {
          console.error("send to", peerId, "failed", err);
          state.status = "failed";
          updateAggregate();
        });
      }
      updateAggregate();
    }

    async function sendFileToPeer(fileId, peerId, file, meta, state, onUpdate) {
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      const dc = pc.createDataChannel(`file-${fileId}`, { ordered: true });
      dc.binaryType = "arraybuffer";
      dc.bufferedAmountLowThreshold = MAX_BUFFER / 2;

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          socket.send(JSON.stringify({
            type: "signal", to: peerId,
            payload: { kind: "ice", fileId, candidate: e.candidate },
          }));
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
          if (state.status !== "done") {
            state.status = "failed";
            onUpdate();
          }
        }
      };

      // Track this pc for incoming signaling
      const key = `out:${fileId}:${peerId}`;
      registerPC(key, pc);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.send(JSON.stringify({
        type: "signal", to: peerId,
        payload: { kind: "offer", fileId, sdp: pc.localDescription },
      }));

      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error("dc open timeout")), 30_000);
        dc.onopen = () => { clearTimeout(timeout); resolve(); };
        dc.onerror = (e) => { clearTimeout(timeout); reject(e); };
      });

      state.status = "sending";
      onUpdate();

      const header = JSON.stringify({ kind: "header", fileId, name: meta.name, size: meta.size, mime: meta.mime });
      dc.send(header);

      let offset = 0;
      const reader = file.stream().getReader();
      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          let buf = value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength);
          let pos = 0;
          while (pos < buf.byteLength) {
            const slice = buf.slice(pos, pos + CHUNK_SIZE);
            while (dc.bufferedAmount > MAX_BUFFER) {
              await new Promise((r) => {
                const onLow = () => { dc.removeEventListener("bufferedamountlow", onLow); r(); };
                dc.addEventListener("bufferedamountlow", onLow);
              });
            }
            dc.send(slice);
            pos += slice.byteLength;
            offset += slice.byteLength;
            state.progress = meta.size ? offset / meta.size : 1;
            onUpdate();
          }
        }
        dc.send(JSON.stringify({ kind: "eof", fileId }));
        await new Promise((r) => {
          const check = () => {
            if (dc.bufferedAmount === 0) r();
            else setTimeout(check, 50);
          };
          check();
        });
        state.status = "done";
        state.progress = 1;
        onUpdate();
      } finally {
        setTimeout(() => {
          try { dc.close(); } catch {}
          try { pc.close(); } catch {}
          signalingPCs.delete(key);
          // Outgoing record cleanup once all peers settled
          const rec = outgoing.get(fileId);
          if (rec) {
            const settled = [...rec.peers.values()].every(
              (s) => s.status === "done" || s.status === "failed",
            );
            if (settled) outgoing.delete(fileId);
          }
        }, 2000);
      }
    }

    // Map of { pc, remoteSet, pendingIce[] } keyed by `${dir}:${fileId}:${peerId}` to route ICE
    const signalingPCs = new Map();

    function registerPC(key, pc) {
      const entry = { pc, remoteSet: false, pendingIce: [] };
      signalingPCs.set(key, entry);
      return entry;
    }
    async function applyRemoteDescription(entry, sdp) {
      await entry.pc.setRemoteDescription(sdp);
      entry.remoteSet = true;
      for (const c of entry.pendingIce) {
        try { await entry.pc.addIceCandidate(c); } catch (e) { console.warn("ice flush fail", e); }
      }
      entry.pendingIce = [];
    }

    function handleFileOffer(data) {
      const wasAtBottom = isAtBottom();
      const card = renderFileBubble({
        who: data.fromWho, name: data.name, size: data.size, mime: data.mime,
        ts: Date.now(), direction: "in",
      });
      if (wasAtBottom) scrollToBottom();
      incoming.set(data.fileId, {
        from: data.from, fromWho: data.fromWho,
        name: data.name, size: data.size, mime: data.mime,
        received: 0, chunks: [], card, pc: null,
      });
    }

    async function handleSignal(data) {
      const { from, fromWho, payload } = data;
      if (!payload || typeof payload !== "object") return;
      const { kind, fileId } = payload;
      if (!fileId) return;

      if (kind === "offer") {
        const rec = incoming.get(fileId);
        if (!rec) return;
        const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
        rec.pc = pc;
        const entry = registerPC(`in:${fileId}:${from}`, pc);

        pc.onicecandidate = (e) => {
          if (e.candidate) {
            socket.send(JSON.stringify({
              type: "signal", to: from,
              payload: { kind: "ice", fileId, candidate: e.candidate },
            }));
          }
        };
        pc.ondatachannel = (e) => {
          const dc = e.channel;
          dc.binaryType = "arraybuffer";
          dc.onmessage = (ev) => receiveChunk(fileId, ev.data);
          dc.onclose = () => {};
        };

        await applyRemoteDescription(entry, payload.sdp);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.send(JSON.stringify({
          type: "signal", to: from,
          payload: { kind: "answer", fileId, sdp: pc.localDescription },
        }));
      } else if (kind === "answer") {
        const entry = signalingPCs.get(`out:${fileId}:${from}`);
        if (!entry) return;
        await applyRemoteDescription(entry, payload.sdp);
      } else if (kind === "ice") {
        const entry =
          signalingPCs.get(`out:${fileId}:${from}`) ||
          signalingPCs.get(`in:${fileId}:${from}`);
        if (!entry) return;
        if (!entry.remoteSet) {
          entry.pendingIce.push(payload.candidate);
        } else {
          try { await entry.pc.addIceCandidate(payload.candidate); } catch (e) { console.warn("ice fail", e); }
        }
      }
    }

    function receiveChunk(fileId, data) {
      const rec = incoming.get(fileId);
      if (!rec) return;
      if (typeof data === "string") {
        let parsed;
        try { parsed = JSON.parse(data); } catch { return; }
        if (parsed.kind === "header") {
          rec.name = parsed.name; rec.size = parsed.size; rec.mime = parsed.mime;
          rec.card.fname.textContent = parsed.name;
          rec.card.status.textContent = "receiving…";
        } else if (parsed.kind === "eof") {
          const blob = new Blob(rec.chunks, { type: rec.mime || "application/octet-stream" });
          rec.card.bar.style.width = "100%";
          rec.card.status.textContent = "received";
          rec.card.status.classList.add("ok");
          showPreview(rec.card, blob, rec.name, rec.mime);
          rec.chunks = [];
          setTimeout(() => {
            if (rec.pc) try { rec.pc.close(); } catch {}
            signalingPCs.delete(`in:${fileId}:${rec.from}`);
            incoming.delete(fileId);
          }, 2000);
        }
        return;
      }
      rec.chunks.push(data);
      rec.received += data.byteLength;
      if (rec.size) {
        rec.card.bar.style.width = `${Math.round((rec.received / rec.size) * 100)}%`;
      }
    }

    // ===== UI wiring for file sending =====
    $("attach").addEventListener("click", () => $("file-input").click());
    $("file-input").addEventListener("change", (e) => {
      for (const f of e.target.files) sendFile(f);
      e.target.value = "";
    });

    document.addEventListener("paste", (e) => {
      if (!socket) return;
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const it of items) {
        if (it.kind === "file") {
          const f = it.getAsFile();
          if (f) sendFile(f);
        }
      }
    });

    const shellEl = document.querySelector(".shell");
    let dragDepth = 0;
    window.addEventListener("dragenter", (e) => {
      if (!socket) return;
      if (!e.dataTransfer?.types?.includes("Files")) return;
      dragDepth++;
      shellEl?.classList.add("dragover");
    });
    window.addEventListener("dragover", (e) => {
      if (e.dataTransfer?.types?.includes("Files")) e.preventDefault();
    });
    window.addEventListener("dragleave", () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) shellEl?.classList.remove("dragover");
    });
    window.addEventListener("drop", (e) => {
      if (!e.dataTransfer?.files?.length) return;
      e.preventDefault();
      dragDepth = 0;
      shellEl?.classList.remove("dragover");
      for (const f of e.dataTransfer.files) sendFile(f);
    });

  </script>
</body>
